<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yeşil Kampüs - Giriş</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GENEL SIFIRLAMA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- MOBİL UYGULAMA ÇERÇEVESİ --- */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 850px;
            background-color: #5c704c; /* Zeytin Yeşili Arka Plan */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* --- DEKORATİF KÖŞE ŞEKİLLERİ --- */
        .shape-top-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 140px;
            background-color: #f4cc3a; /* Hardal Sarısı */
            border-bottom-right-radius: 60px;
            z-index: 1;
        }

        .shape-top-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 130px;
            height: 180px;
            background-color: #e6cda3; /* Açık Bej */
            border-bottom-left-radius: 80px;
            z-index: 1;
        }

        .shape-bottom-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 150px;
            height: 100px;
            background-color: #e6cda3; /* Açık Bej */
            border-top-right-radius: 70px;
            z-index: 1;
        }

        /* --- İÇERİK ALANI --- */
        .content {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 30px;
            justify-content: center;
        }

        /* --- YENİ ZARİF BAŞLIK VE LOGO ALANI --- */
        .header {
            text-align: center;
            margin-bottom: 35px;
            margin-top: -20px;
            position: relative;
            z-index: 2;
        }

        .logo-icon {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .logo-icon img {
            width: 70px; /* ZARİF BOYUTLU LOGOMUZ */
            height: 70px;
            object-fit: contain;
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 13px;
            font-weight: 400;
        }

        /* --- FORM ALANI --- */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .form-group input {
            width: 100%;
            height: 55px;
            background-color: #f8f5ee; /* İkinci görseldeki sıcak krem rengi */
            border: none;
            border-radius: 14px;
            padding: 0 20px;
            font-size: 15px;
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #999;
            font-weight: 500;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 2px rgba(244, 204, 58, 0.5);
        }

        /* --- GİRİŞ BUTONU --- */
        .login-btn {
            width: 100%;
            height: 55px;
            background-color: #b8bc73;
            color: #ffffff;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .login-btn:active {
            transform: scale(0.97);
            background-color: #a3a763;
        }

        /* --- KAYIT OL LİNKİ --- */
        .register-link {
            text-align: center;
            margin-top: 30px;
            color: #ffffff;
            font-size: 14px;
        }

        .register-link a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Arka Plan Dekoratif Şekiller -->
        <div class="shape-top-left"></div>
        <div class="shape-top-right"></div>
        <div class="shape-bottom-left"></div>

        <div class="content">
            
            <!-- 🌟 İKİNCİ GÖRSELDEKİ ZARİF BAŞLIK VE LOGO -->
            <div class="header">
                <div class="logo-icon">
                    <img src="images/logo.png" alt="Logo" onerror="this.outerHTML='<span style=\'font-size:55px\'>🌱</span>'">
                </div>
                <h1>Yeşil Kampüs</h1>
                <p>Sürdürülebilir bir gelecek için ilk adımı at</p>
            </div>

            <form onsubmit="event.preventDefault();">
                
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" id="email" placeholder="ogr@iuc.edu.tr" required>
                </div>

                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="password" placeholder="••••••••••" required>
                </div>

                <!-- 🌟 Tıklanabilen Firebase Butonumuz -->
                <button type="button" id="loginBtn" class="login-btn">Giriş Yap</button>

            </form>

            <div class="register-link">
                Hesabın yok mu? <a href="kayit.html">Kayıt Ol</a>
            </div>

        </div>
    </div>

    <!-- 🚀 HAYAT KURTARAN FİREBASE BAĞLANTIMIZ BURADA GÜVENDE -->
    <script type="module" src="app.js"></script>
</body>
</html>
